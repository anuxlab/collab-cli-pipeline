name: Local AI Agent Experiment — Free Hosted Runner (Resource-Aware SLM)

# Deliberately manual-only. Do not add push, pull_request, or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Select one small model for this workflow execution"
        type: choice
        required: true
        default: "qwen2.5-coder:7b-instruct-q4_K_M"
        options:
          - "qwen2.5-coder:3b"
          - "qwen3:4b"
          - "qwen2.5-coder:7b-instruct-q4_K_M"
          - "deepseek-r1:7b"
      max_repairs:
        description: "Maximum repair attempts after the initial generation (5 = up to 6 total generations)"
        type: choice
        required: true
        default: "5"
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      model_timeout:
        description: "Per-request local model timeout in seconds"
        type: choice
        required: true
        default: "3600"
        options:
          - "900"
          - "1800"
          - "3600"
          - "7200"
      execution_timeout:
        description: "Generated script execution timeout in seconds"
        type: choice
        required: true
        default: "60"
        options:
          - "30"
          - "60"
          - "120"

      enable_web_search:
        description: "Allow the agent to autonomously search for current APIs, documentation and unfamiliar errors"
        type: boolean
        required: true
        default: true
      web_search_query:
        description: "Search query for relevant APIs, documentation, or error references (optional)"
        type: string
        required: false
        default: ""
      enable_dspy_planning:
        description: "Use DSPy for structured task planning with the same local Ollama model (adds one model call)"
        type: boolean
        required: true
        default: false
      enable_notebook_benchmark:
        description: "Run progressive simple-to-complex notebook-generation benchmark (adds multiple model calls)"
        type: boolean
        required: true
        default: false
      notebook_task_set:
        description: "Notebook benchmark difficulty range"
        type: choice
        required: true
        default: "all"
        options:
          - "all"
          - "simple"
          - "complex"
      enable_dspy_prompt_optimization:
        description: "Run baseline vs DSPy BootstrapFewShot prompt optimization experiment (additional model calls)"
        type: boolean
        required: true
        default: false
      notebook_seed:
        description: "Reproducibility seed shared by baseline and optimized notebook runs"
        type: string
        required: true
        default: "42"
      notebook_holdout_rotation:
        description: "Rotate DSPy held-out tasks for repeated prompt-optimization experiments"
        type: choice
        required: true
        default: "0"
        options:
          - "0"
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

concurrency:
  group: ai-agent-high-end-reasoning-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      run_dir: ${{ steps.meta.outputs.run_dir }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    env:
      MODEL_ID: ${{ inputs.model_id }}
      MODEL_SLUG: ${{ inputs.model_id == 'qwen2.5-coder:3b' && 'qwen25-coder-3b' || inputs.model_id == 'qwen3:4b' && 'qwen3-4b' || inputs.model_id == 'deepseek-r1:7b' && 'deepseek-r1-7b' || 'qwen25-coder-7b' }}
      MODEL_QUANTIZATION: "Ollama model tag quantization (recorded in model metadata)"
      PYTHONUNBUFFERED: "1"
      AGENT_MAX_WEB_SEARCHES_PER_ATTEMPT: "2"
      AGENT_MAX_WEB_SEARCHES_PER_RUN: "8"
      OLLAMA_NUM_CTX: "4096"
      OLLAMA_NUM_PREDICT: "1200"
      OLLAMA_NUM_BATCH: "8"
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Define immutable run directory
        id: meta
        shell: bash
        run: |
          run_dir="outputs/agent_runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ env.MODEL_SLUG }}"
          artifact_name="agent-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.MODEL_SLUG }}"
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          mkdir -p "$run_dir"
          python - <<'PYMETA'
          import json, os, platform
          from datetime import datetime, timezone
          p = os.environ["RUN_DIR"]
          with open(os.path.join(p, "run_metadata.json"), "w") as f:
              json.dump({
                  "workflow": os.environ.get("GITHUB_WORKFLOW"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "commit_sha": os.environ.get("GITHUB_SHA"),
                  "ref": os.environ.get("GITHUB_REF"),
                  "model": os.environ.get("MODEL_ID"),
                  "python": platform.python_version(),
                  "started_at_utc": datetime.now(timezone.utc).isoformat()
              }, f, indent=2)
          PYMETA
        env:
          RUN_DIR: outputs/agent_runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ env.MODEL_SLUG }}

      - name: Record hosted runner resources
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h "$GITHUB_WORKSPACE"
          echo "=== CPU ==="
          nproc
          echo "=== GPU availability ==="
          if command -v nvidia-smi >/dev/null 2>&1; then nvidia-smi; else echo "No NVIDIA GPU exposed by this GitHub-hosted runner; Ollama will use CPU."; fi

      - name: Preflight selected SLM against available runner resources
        id: resource_gate
        env:
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        shell: bash
        run: |
          set -euo pipefail
          total_kb=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          available_kb=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          free_gb=$(df -BG "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub("G", "", $4); print $4}')
          total_gb=$((total_kb / 1024 / 1024))
          available_gb=$((available_kb / 1024 / 1024))
          # Conservative guard for free hosted runners; no attempt is made to swap in a huge model.
          required_gb=7
          case "$MODEL_ID" in *:3b|*:4b) required_gb=5 ;; *:7b*) required_gb=7 ;; esac
          status=ready
          if [ "$available_gb" -lt "$required_gb" ] || [ "$free_gb" -lt 8 ]; then status=skip; fi
          printf 'total_ram_gib=%s\navailable_ram_gib=%s\nfree_disk_gib=%s\nrequired_available_ram_gib=%s\nstatus=%s\n' "$total_gb" "$available_gb" "$free_gb" "$required_gb" "$status" | tee "$RUN_DIR/model_resource_gate.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = skip ]; then echo "Model skipped before download: runner did not meet resource gate." >> "$RUN_DIR/model_resource_gate.txt"; fi

      - name: Save runner resource diagnostics
        env:
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        run: |
          python - <<'PYRESOURCE'
          import json, os, shutil, subprocess
          from pathlib import Path
          mem = {}
          try:
              for line in Path("/proc/meminfo").read_text().splitlines():
                  key, value = line.split(":", 1)
                  if key in {"MemTotal", "MemAvailable", "SwapTotal", "SwapFree"}:
                      mem[key] = int(value.strip().split()[0])
          except Exception as exc:
              mem["read_error"] = str(exc)
          gpu = {"available": False, "details": "No NVIDIA GPU detected; standard hosted runner uses CPU inference."}
          try:
              result = subprocess.run(["nvidia-smi", "--query-gpu=name,memory.total", "--format=csv,noheader"], text=True, capture_output=True, timeout=5, check=True)
              gpu = {"available": True, "details": result.stdout.strip()}
          except Exception:
              pass
          usage = shutil.disk_usage(os.environ["GITHUB_WORKSPACE"])
          record = {
              "cpu_count": os.cpu_count(),
              "memory_kib": mem,
              "workspace_disk_bytes": {"total": usage.total, "used": usage.used, "free": usage.free},
              "gpu": gpu,
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
          }
          target = Path(os.environ["RUN_DIR"]) / "runner_resources.json"
          target.write_text(json.dumps(record, indent=2), encoding="utf-8")
          print(json.dumps(record, indent=2))
          PYRESOURCE

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests 'nbformat>=5.9,<6' scikit-learn numpy 'langgraph>=0.2,<2' 'ddgs>=9.14,<10' pytest

      - name: Install optional DSPy planner
        if: ${{ inputs.enable_dspy_planning || inputs.enable_dspy_prompt_optimization }}
        run: pip install -r requirements-dspy.txt

      - name: Run agent orchestration tests
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests/test_agent_experiment.py tests/test_agent_langgraph.py tests/test_web_search.py tests/test_notebook_builder.py tests/test_notebook_benchmark.py

      - name: Build isolated code-execution image
        run: docker build --file Dockerfile.agent-sandbox --tag collab-agent-sandbox:latest .

      - name: Install and start local Ollama daemon
        id: ollama_setup
        continue-on-error: true
        env:
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        shell: bash
        run: |
          set +e
          status=success
          curl -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/install-ollama.sh" 2> "$RUNNER_TEMP/ollama-install-stderr.log"
          if [ $? -ne 0 ]; then
            status=failure
            echo "Ollama installer download failed" | tee "$RUN_DIR/ollama_setup_error.txt"
          else
            sh "$RUNNER_TEMP/install-ollama.sh" > "$RUN_DIR/ollama-install.log" 2>&1
            if [ $? -ne 0 ]; then status=failure; fi
          fi
          if [ "$status" = success ]; then
            # The official installer normally starts a system service. Reuse it when
            # healthy; starting another ollama serve would fail with address-already-in-use.
            ready=0
            for i in $(seq 1 15); do
              if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              ( env OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_KEEP_ALIVE=1m OLLAMA_CONTEXT_LENGTH=4096 OLLAMA_NUM_BATCH=16 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 ollama serve > "$RUNNER_TEMP/ollama-serve.log" 2>&1 & )
              for i in $(seq 1 45); do
                if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then ready=1; break; fi
                sleep 2
              done
            fi
            if [ "$ready" -ne 1 ]; then status=failure; echo "Ollama daemon did not become ready" > "$RUN_DIR/ollama_setup_error.txt"; fi
          fi
          echo "status=$status" > "$RUN_DIR/ollama_setup_status.txt"
          exit 0

      - name: Restore Ollama model-layer cache
        if: ${{ steps.resource_gate.outputs.status == 'ready' && steps.ollama_setup.outcome == 'success' }}
        id: ollama_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ollama/models
            /usr/share/ollama/.ollama/models
          key: ${{ runner.os }}-ollama-${{ inputs.model_id }}-v1

      - name: Pull quantized model with diagnostics
        id: pull_model
        if: ${{ steps.resource_gate.outputs.status == 'ready' && steps.ollama_setup.outcome == 'success' }}
        continue-on-error: true
        env:
          MODEL_ID: ${{ env.MODEL_ID }}
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        shell: bash
        run: |
          set +e
          if ! command -v ollama >/dev/null 2>&1; then
            echo "ollama executable unavailable" > "$RUN_DIR/model_pull.log"
            echo "status=failure" > "$RUN_DIR/model_pull_status.txt"
            exit 0
          fi
          timeout 2400 ollama pull "$MODEL_ID" > "$RUN_DIR/model_pull.log" 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$RUN_DIR/model_pull_status.txt"
          if [ "$rc" -eq 0 ]; then echo "status=success" >> "$RUN_DIR/model_pull_status.txt"; else echo "status=failure" >> "$RUN_DIR/model_pull_status.txt"; fi
          ollama list > "$RUN_DIR/ollama-list-after-pull.txt" 2>&1 || true
          exit 0

      - name: Save Ollama model-layer cache
        if: ${{ always() && steps.pull_model.outcome == 'success' && steps.ollama_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ollama/models
            /usr/share/ollama/.ollama/models
          key: ${{ runner.os }}-ollama-${{ inputs.model_id }}-v1

      - name: Verify model is available locally
        id: model_check
        if: ${{ always() && steps.resource_gate.outputs.status == 'ready' }}
        continue-on-error: true
        env:
          MODEL_ID: ${{ env.MODEL_ID }}
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        shell: bash
        run: |
          set +e
          if command -v ollama >/dev/null 2>&1 && curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
            ollama show "$MODEL_ID" > "$RUN_DIR/model_check.log" 2>&1
            rc=$?
          else
            echo "Ollama daemon or executable unavailable" > "$RUN_DIR/model_check.log"
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "status=success" > "$RUN_DIR/model_check_status.txt"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "status=failure" > "$RUN_DIR/model_check_status.txt"
          fi
          exit 0

      - name: Record swap policy
        env:
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        run: |
          free -h > "$RUN_DIR/memory-before-inference.txt"
          echo "No swapfile is created: large swap-backed model inference can thrash CPU and disk on hosted runners." > "$RUN_DIR/swap-policy.txt"

      - name: Start lightweight Ollama memory monitor
        if: ${{ steps.resource_gate.outputs.status == 'ready' && steps.model_check.outputs.available == 'true' }}
        env:
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        shell: bash
        run: |
          python scripts/monitor_ollama_memory.py \
            --output "$RUN_DIR/ollama_memory_samples.csv" \
            --stop-file "$RUN_DIR/.stop_memory_monitor" \
            --interval 2 &
          echo $! > "$RUN_DIR/.memory_monitor_pid"

      - name: Progressive notebook-generation benchmark
        id: notebook_benchmark
        if: ${{ success() && inputs.enable_notebook_benchmark && steps.resource_gate.outputs.status == 'ready' && steps.model_check.outputs.available == 'true' }}
        continue-on-error: true
        env:
          MODEL_ID: ${{ env.MODEL_ID }}
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}/notebook_benchmark
          MODEL_TIMEOUT: ${{ inputs.model_timeout }}
          TASK_SET: ${{ inputs.notebook_task_set }}
          NOTEBOOK_SEED: ${{ inputs.notebook_seed }}
          NOTEBOOK_HOLDOUT_ROTATION: ${{ inputs.notebook_holdout_rotation }}
          ENABLE_DSPY_OPTIMIZATION: ${{ inputs.enable_dspy_prompt_optimization }}
          AGENT_USE_DOCKER: "1"
          AGENT_SANDBOX_IMAGE: collab-agent-sandbox:latest
        shell: bash
        run: |
          OPTIMIZER_ARGS=()
          if [ "$ENABLE_DSPY_OPTIMIZATION" = "true" ]; then
            OPTIMIZER_ARGS+=(--dspy-optimize)
          fi
          python scripts/notebook_benchmark.py \
            --model "$MODEL_ID" \
            --output-dir "$RUN_DIR" \
            --timeout "$MODEL_TIMEOUT" \
            --max-repairs 2 \
            --task-set "$TASK_SET" \
            --phase all \
            --seed "$NOTEBOOK_SEED" \
            --holdout-rotation "$NOTEBOOK_HOLDOUT_ROTATION" \
            "${OPTIMIZER_ARGS[@]}"

      - name: Generate, execute, diagnose, and repair
        id: agent_run
        if: ${{ success() && steps.resource_gate.outputs.status == 'ready' && steps.model_check.outputs.available == 'true' }}
        continue-on-error: true
        env:
          MODEL_ID: ${{ env.MODEL_ID }}
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
          MAX_REPAIRS: ${{ inputs.max_repairs }}
          EXECUTION_TIMEOUT: ${{ inputs.execution_timeout }}
          MODEL_TIMEOUT: ${{ inputs.model_timeout }}
          WEB_SEARCH_QUERY: ${{ inputs.web_search_query }}
          ENABLE_WEB_SEARCH: ${{ inputs.enable_web_search }}
          ENABLE_DSPY_PLANNING: ${{ inputs.enable_dspy_planning }}
          AGENT_USE_DOCKER: "1"
          AGENT_SANDBOX_IMAGE: collab-agent-sandbox:latest
        run: |
          DSPY_ARGS=()
          if [ "$ENABLE_DSPY_PLANNING" = "true" ]; then
            DSPY_ARGS+=(--dspy-planning)
          fi
          WEB_SEARCH_ARGS=()
          if [ "$ENABLE_WEB_SEARCH" = "true" ]; then
            WEB_SEARCH_ARGS+=(--web-search)
            if [ -n "$WEB_SEARCH_QUERY" ]; then
              WEB_SEARCH_ARGS+=(--web-query "$WEB_SEARCH_QUERY")
            fi
          fi
          python scripts/agent_langgraph.py \
            --model "$MODEL_ID" \
            --run-dir "$RUN_DIR" \
            --max-repairs "$MAX_REPAIRS" \
            --execution-timeout "$EXECUTION_TIMEOUT" \
            --api-timeout "$MODEL_TIMEOUT" \
            "${WEB_SEARCH_ARGS[@]}" \
            "${DSPY_ARGS[@]}"

      - name: Stop memory monitor and capture peak RSS
        if: always()
        env:
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        shell: bash
        run: |
          touch "$RUN_DIR/.stop_memory_monitor"
          if [ -f "$RUN_DIR/.memory_monitor_pid" ]; then
            pid=$(cat "$RUN_DIR/.memory_monitor_pid")
            for i in $(seq 1 10); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            kill "$pid" 2>/dev/null || true
          fi
          rm -f "$RUN_DIR/.memory_monitor_pid" "$RUN_DIR/.stop_memory_monitor"

      - name: Record overall workflow result
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent_run.outcome }}
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p = os.path.join(os.environ["RUN_DIR"], "workflow_status.json")
          with open(p, "w") as f:
              json.dump({"agent_step_outcome": os.environ.get("AGENT_OUTCOME", "not-run"), "recorded_at_utc": datetime.now(timezone.utc).isoformat()}, f, indent=2)
          PY

      - name: Capture daemon and system diagnostics
        if: always()
        env:
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        shell: bash
        run: |
          set +e
          [ -f "$RUNNER_TEMP/ollama-serve.log" ] && cp "$RUNNER_TEMP/ollama-serve.log" "$RUN_DIR/ollama-serve.log"
          [ -f "$RUNNER_TEMP/ollama-install-stderr.log" ] && cp "$RUNNER_TEMP/ollama-install-stderr.log" "$RUN_DIR/ollama-install-stderr.log"
          sudo journalctl -u ollama --no-pager -n 2000 > "$RUN_DIR/ollama-systemd.log" 2>&1 || true
          [ -f "$RUNNER_TEMP/ollama-install.sh" ] && sha256sum "$RUNNER_TEMP/ollama-install.sh" > "$RUN_DIR/ollama-installer-sha256.txt"
          [ -f "$RUN_DIR/ollama_setup_status.txt" ] || echo "status=not_run" > "$RUN_DIR/ollama_setup_status.txt"
          [ -f "$RUN_DIR/model_pull_status.txt" ] || echo "status=not_run" > "$RUN_DIR/model_pull_status.txt"
          free -b > "$RUN_DIR/final-free-memory.txt" 2>&1
          df -h "$GITHUB_WORKSPACE" > "$RUN_DIR/final-disk.txt" 2>&1
          (ollama ps > "$RUN_DIR/ollama-ps.txt" 2>&1) || true
          (docker image ls > "$RUN_DIR/docker-images.txt" 2>&1) || true

      - name: Clean temporary model process and Docker build artifacts
        if: always()
        env:
          MODEL_ID: ${{ env.MODEL_ID }}
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        shell: bash
        run: |
          set +e
          [ -f "$RUN_DIR/.stop_memory_monitor" ] || touch "$RUN_DIR/.stop_memory_monitor"
          ollama stop "$MODEL_ID" > "$RUN_DIR/ollama-stop.log" 2>&1
          docker image rm collab-agent-sandbox:latest > "$RUN_DIR/docker-cleanup.log" 2>&1
          # Preserve ~/.ollama/models because it is the cache; remove only transient installer/log files.
          rm -f "$RUNNER_TEMP/install-ollama.sh" "$RUNNER_TEMP/ollama-serve.log"
          docker container prune -f >> "$RUN_DIR/docker-cleanup.log" 2>&1

      - name: Build analysis-first artifact report
        if: always()
        env:
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
          MODEL_ID: ${{ env.MODEL_ID }}
          MODEL_QUANTIZATION: ${{ env.MODEL_QUANTIZATION || 'quantized Ollama model' }}
          OLLAMA_NUM_CTX: ${{ env.OLLAMA_NUM_CTX }}
          OLLAMA_NUM_PREDICT: ${{ env.OLLAMA_NUM_PREDICT }}
          OLLAMA_NUM_BATCH: ${{ env.OLLAMA_NUM_BATCH }}
        run: |
          python scripts/finalize_agent_report.py --run-dir "$RUN_DIR"

      - name: Capture Ollama daemon logs
        if: always()
        env:
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
        run: |
          if [ -f "$RUNNER_TEMP/ollama-serve.log" ]; then
            cp "$RUNNER_TEMP/ollama-serve.log" "$RUN_DIR/ollama-serve.log"
          fi

      - name: Upload model run, notebook, audit trail, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.run_dir }}/**
          if-no-files-found: warn
          retention-days: 90

      - name: Fail workflow if agent did not pass
        if: ${{ steps.resource_gate.outputs.status == 'ready' && steps.agent_run.outcome != 'success' }}
        run: exit 1

  persist-results:
    # The agent job has read-only repository access. Only this separate job can write.
    concurrency:
      group: agent-results-${{ github.ref }}
      cancel-in-progress: false
    if: always() && needs.agent.outputs.run_dir != ''
    needs: agent
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository for output persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download this run's artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.agent.outputs.artifact_name }}
          path: staging-agent-results
        continue-on-error: true

      - name: Save this model run under a unique immutable path
        env:
          RUN_DIR: ${{ needs.agent.outputs.run_dir }}
        run: |
          if [ ! -d staging-agent-results ] || [ -z "$(find staging-agent-results -type f -print -quit)" ]; then
            echo "No run files were available to persist; check the agent job logs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          # The run artifact stays in staging while we reset to the newest remote commit.
          # This makes concurrent workflows safe even when each updates comparison.csv/md.
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            mkdir -p "$RUN_DIR"
            cp -R staging-agent-results/. "$RUN_DIR/"
            python scripts/compare_agent_runs.py
            git add -f "$RUN_DIR" outputs/agent_runs/comparison.csv outputs/agent_runs/comparison.md
            if git diff --cached --quiet; then
              echo "No output changes to commit."
              exit 0
            fi
            git commit -m "experiment: save model run ${{ github.run_id }} [skip ci]"
            if git push origin "HEAD:$branch"; then
              echo "Persisted experiment results on attempt $attempt."
              exit 0
            fi
            echo "Push race on attempt $attempt; refreshing remote and rebuilding comparison report."
          done
          echo "Could not persist after 3 attempts; artifact remains available in Actions."
          exit 1
