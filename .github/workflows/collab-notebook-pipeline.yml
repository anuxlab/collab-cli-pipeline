name: Collab CLI Notebook Pipeline

on:
  # Manual runs only. Do not trigger on pushes or pull requests.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collab-notebook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Prepare output directory
        run: mkdir -p outputs

      # Integration point: set COLLAB_CLI_COMMAND as a repository variable only after
      # confirming the actual CLI syntax. Do not put credentials in this variable.
      - name: Run optional Collab CLI command
        if: ${{ vars.COLLAB_CLI_COMMAND != '' }}
        env:
          COLLAB_CLI_COMMAND: ${{ vars.COLLAB_CLI_COMMAND }}
        run: bash scripts/run_collab_cli.sh

      - name: Execute ML notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/ml_pipeline.ipynb \
            --output ml_pipeline_executed.ipynb \
            --output-dir notebooks \
            --ExecutePreprocessor.timeout=600

      - name: Validate generated outputs
        run: python scripts/validate_outputs.py

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collab-cli-ml-run-${{ github.run_number }}
          path: |
            outputs/
            notebooks/ml_pipeline_executed.ipynb
          if-no-files-found: error
          retention-days: 30

      - name: Commit outputs back to repository
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ notebooks/ml_pipeline_executed.ipynb
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "ci: save Collab CLI notebook run outputs [skip ci]"
            git push
          fi
